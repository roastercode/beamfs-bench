[package]
name = "beamfs-bench"
version = "0.1.0"
edition = "2021"
authors = ["Aurelien DESBRIERES <aurelien@hackers.camp>"]
license = "GPL-2.0-only"
description = "Unified bench harness for BEAMFS resilience testing under RadFI fault injection"
repository = "https://github.com/roastercode/yocto-beamfs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
